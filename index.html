<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<meta name="description" content="First-person horror game set in a hostel building: explore, open doors, keep the torch on.">
<title>Manju Mania</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070c; font-family: -apple-system, system-ui, sans-serif; }
  canvas { display: block; }
  kbd { display: inline-block; min-width: 14px; text-align: center; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.22); border-radius: 3px; padding: 1px 6px; margin-right: 3px; font: 12px ui-monospace, monospace; color: #e6ebe9; }
  /* ---------- title / pause menu ---------- */
  #menu { position: fixed; inset: 0; z-index: 10; color: #dfe4e2; font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif; user-select: none;
    background: linear-gradient(90deg, rgba(2,5,7,.88) 0%, rgba(2,5,7,.55) 38%, rgba(2,5,7,0) 70%), radial-gradient(ellipse at 70% 50%, transparent 40%, rgba(0,0,0,.55) 100%); }
  #menu[hidden] { display: none; }
  #menu.pause { background: rgba(2,5,7,.62); }
  #menu .col { position: absolute; left: clamp(20px, 7vw, 120px); top: clamp(30px, 13vh, 150px); right: 20px; }
  #title { display: block; margin-left: -4px; }
  #menu .tag { margin: 4px 0 0 2px; font: 500 12px ui-monospace, "SF Mono", Menlo, monospace; letter-spacing: 4px; text-transform: uppercase; color: rgba(223,228,226,.45); }
  #items { display: flex; flex-direction: column; align-items: flex-start; margin-top: clamp(26px, 7vh, 70px); gap: 2px; }
  #items button, #panel .opt { all: unset; cursor: pointer; position: relative; box-sizing: border-box; width: min(430px, 80vw); padding: 5px 22px; font-size: clamp(20px, 2.3vw, 30px); font-weight: 500; letter-spacing: .5px; text-transform: uppercase; color: #e8ecea; }
  #items button.off { color: rgba(232,236,234,.28); cursor: default; }
  #items button.sel { color: #071012; background: #5fa49e;
    clip-path: polygon(0 0, calc(100% - 26px) 0, calc(100% - 26px) 5px, 100% 5px, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%); }
  #panel { position: absolute; left: clamp(20px, 7vw, 120px); bottom: clamp(24px, 9vh, 90px); width: min(430px, 86vw); padding: 16px 20px 18px; background: rgba(4,9,11,.82); border-left: 3px solid #5fa49e; font-size: 14px; }
  #panel[hidden] { display: none; }
  @media (min-width: 1000px) { #panel { left: calc(clamp(20px, 7vw, 120px) + 470px); width: 380px; } }
  #panel h3 { margin: 0 0 10px; font: 600 12px ui-monospace, Menlo, monospace; letter-spacing: 4px; text-transform: uppercase; color: #5fa49e; }
  #panel table { border-collapse: collapse; width: 100%; }
  #panel td { padding: 3px 0; color: rgba(232,236,234,.8); }
  #panel td:first-child { width: 150px; }
  #panel .opt { width: 100%; padding: 6px 0; font-size: 18px; display: flex; justify-content: space-between; }
  #panel .opt .v { color: #5fa49e; }
  #panel .opt:hover { color: #fff; }
  #loading { margin-top: 18px; font: 12px ui-monospace, Menlo, monospace; letter-spacing: 3px; color: rgba(223,228,226,.5); animation: blink 1.1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  #menu .foot { position: absolute; right: 22px; bottom: 16px; font: 11px ui-monospace, Menlo, monospace; letter-spacing: 2px; color: rgba(223,228,226,.3); text-align: right; line-height: 1.7; }
  #menu.pause .foot, #menu.pause .tag { display: none; }
  #tear { position: fixed; inset: 0; z-index: 11; pointer-events: none; display: none; mix-blend-mode: screen; }
  #tear i { position: absolute; left: -10vw; right: -10vw; background: linear-gradient(90deg, rgba(95,164,158,.0), rgba(180,230,225,.5) 30%, rgba(255,60,60,.35) 60%, rgba(0,0,0,0)); }
  /* ---------- cheat console ---------- */
  #devcon { position: fixed; left: 14px; right: 14px; bottom: 14px; max-width: 760px; z-index: 30; background: rgba(3,7,9,.9); border-left: 3px solid #5fa49e; font: 13px/1.5 ui-monospace, "SF Mono", Menlo, monospace; color: #cfd6d3; box-shadow: 0 8px 30px rgba(0,0,0,.5); }
  #devcon[hidden] { display: none; }
  #devcon .log { max-height: 42vh; overflow-y: auto; padding: 10px 14px 4px; }
  #devcon .log .cmd { color: #5fa49e; }
  #devcon .log .err { color: #e07a6e; }
  #devcon .log .dim { color: rgba(207,214,211,.45); }
  #devcon .log .k { color: #e9ecea; }
  #devcon .row { display: flex; gap: 8px; padding: 6px 14px 10px; border-top: 1px solid rgba(95,164,158,.25); }
  #devcon .row span { color: #5fa49e; }
  #devcon input { all: unset; flex: 1; color: #fff; caret-color: #5fa49e; }
  body.nohud #crosshair, body.nohud #hud, body.nohud #hint { display: none !important; }
  body.inmenu #crosshair, body.inmenu #hud, body.inmenu #hint { display: none !important; }
  #crosshair { position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 0 2px #000; pointer-events: none; }
  #hud { position: fixed; left: 14px; top: 12px; color: #fff; font: bold 14px 'Courier New', monospace; text-shadow: 0 1px 3px rgba(0,0,0,.8); pointer-events: none; line-height: 1.5; }
  #hud b { font-size: 17px; }
  #hint { position: fixed; left: 50%; top: calc(50% + 26px); transform: translateX(-50%); color: #fff; font: 600 14px -apple-system, system-ui, sans-serif; background: rgba(0,0,0,.45); padding: 4px 10px; border-radius: 6px; display: none; pointer-events: none; }
  @media (max-height: 560px) {
    #menu { overflow-y: auto; }
    #menu .col { position: relative; left: auto; top: auto; right: auto; padding: 16px 20px; box-sizing: border-box; }
    #menu .tag, #menu .foot { display: none; }
    #items { margin-top: 12px; }
    #panel { position: relative; left: auto; bottom: auto; width: auto; margin: 0 20px 16px; }
  }
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/",
  "three-mesh-bvh": "./node_modules/three-mesh-bvh/build/index.module.js"
} }
</script>
</head>
<body class="inmenu">
<div id="menu">
  <div class="col">
    <canvas id="title"></canvas>
    <div class="tag">Lights out was an hour ago</div>
    <nav id="items"></nav>
    <div id="loading">Loading building…</div>
  </div>
  <div id="panel" hidden></div>
  <div class="foot">Headphones recommended<br>` opens the console<br>Prototype build</div>
</div>
<div id="tear"></div>
<div id="crosshair"></div>
<div id="hint"></div>
<div id="hud"><b id="floor">Outside</b><br><span id="mode">Walking</span></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
